<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ еды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); font-family: sans-serif; }
        button { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Наше Меню</h1>
    <div id="menu">
        <p>Пицца "Маргарита" - 500₽</p>
        <button onclick="sendOrder('Пицца Маргарита', 500)">Заказать</button>
    </div>

    <script>
        // 2. Инициализируем объект WebApp
        const tg = window.Telegram.WebApp;

        // 3. СООБЩАЕМ ТЕЛЕГРАМУ, ЧТО ПРИЛОЖЕНИЕ ГОТОВО
        tg.ready();

        // Расширяем на весь экран (опционально)
        tg.expand();

        function sendOrder(name, price) {
            const data = {
                user_id: tg.initDataUnsafe.user.id,
                items_summary: name,
                total: price
            };

            // Отправляем данные на ваш Backend (FastAPI)
            fetch('https://symmetrical-space-computing-machine-4j6wqjxxj97rfqqx9-8000.app.github.dev/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(response => {
                if (response.ok) {
                    tg.close(); // Закрываем Web App после отправки
                }
            });
        }
    </script>
</body>
</html>
