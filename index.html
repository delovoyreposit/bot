<div id="app">
    <div class="product">
        <span>Маргарита — 550₽</span>
        <button onclick="order('Маргарита', 550)">Заказать</button>
    </div>
    <div class="product">
        <span>Пепперони — 650₽</span>
        <button onclick="order('Пепперони', 650)">Заказать</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function order(name, price) {
        fetch('https://symmetrical-space-computing-machine-4j6wqjxxj97rfqqx9-8000.app.github.dev/', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                user_id: tg.initDataUnsafe.user.id,
                items: name,
                total: price
            })
        });
        tg.close();
    }
</script>
